<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap | SPA Application</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header class="app-header">
        <h1>WeatherMap</h1>
        <p>Discover real-time weather anywhere</p>
    </header>

    <main class="main-container">
        
        <section class="search-section">
            <form id="search-form" class="search-form">
                <input type="text" id="location-input" placeholder="Search for a city..." required autocomplete="off">
                <button type="submit" id="search-btn">
                    <span id="btn-text">Get Weather</span>
                </button>
            </form>
        </section>

        <section id="favorites-section" class="favorites-section hidden">
            <span class="fav-label">Saved:</span>
            <div id="favorites-list" class="favorites-list"></div>
        </section>

        <section class="map-wrapper">
            <div id="loading-overlay" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>Fetching weather data...</p>
            </div>
            <div id="map"></div>
        </section>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
