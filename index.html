<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap | Real-time Weather</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS first so style.css can override it -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-cloud-sun"></i>
            <div>
                <h1 class="page-title">Weather<span>Map</span></h1>
                <p>Discover real-time weather anywhere</p>
            </div>
        </div>
    </header>

    <main class="main-layout">
        <form id="search-form" class="search-container" autocomplete="off">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="city-input" placeholder="Search for a city..." aria-label="City name">
            </div>
            <button type="submit" id="search-btn"><i class="fa-solid fa-paper-plane"></i> Get Weather</button>
            <button type="button" id="locate-btn" aria-label="Use my location"><i class="fa-solid fa-location-crosshairs"></i> My Location</button>
        </form>

        <div id="loader" class="spinner hidden" role="status" aria-label="Loading"></div>
        <div id="error-card" class="error-card hidden" role="alert"></div>

        <div class="content-grid">

            <div class="left-column">
                <div class="saved-cities">
                    <span><i class="fa-solid fa-star star-icon"></i> Saved:</span>
                    <div id="saved-list" class="saved-list"></div>
                </div>

                <div class="current-weather-card">
                    <div class="card-header">
                        <div>
                            <h2 id="main-city">City</h2>
                            <p id="main-country">Country</p>
                        </div>
                        <span id="main-date">Date</span>
                    </div>
                    <div class="weather-main">
                        <img id="main-icon" class="weather-icon" src="https://cdn-icons-png.flaticon.com/512/1779/1779940.png" alt="Weather icon">
                        <div class="temp-box">
                            <h2 id="main-temp" class="temp">--°</h2>
                            <p id="main-desc">Description</p>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail"><i class="fa-solid fa-cloud"></i> <span id="main-clouds">--%</span></div>
                        <div class="detail"><i class="fa-solid fa-droplet"></i> <span id="main-humidity">--%</span></div>
                        <div class="detail"><i class="fa-solid fa-wind"></i> <span id="main-wind">-- km/h</span></div>
                        <div class="detail"><i class="fa-solid fa-gauge"></i> <span id="main-pressure">-- hPa</span></div>
                    </div>
                </div>

                <div class="forecast-card">
                    <div class="forecast-header">
                        <i class="fa-solid fa-calendar-days"></i> 5-Day Forecast
                    </div>
                    <div class="forecast-grid" id="forecast-grid"></div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn-save" id="save-btn"><i class="fa-regular fa-bookmark"></i> Save City</button>
                    <button type="button" class="btn-share" id="share-btn"><i class="fa-solid fa-share-nodes"></i> Share Weather</button>
                </div>
            </div>

            <div class="right-column">
                <div class="map-card">
                    <div id="map"></div>
                </div>
            </div>

        </div>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
